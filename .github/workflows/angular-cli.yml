name: my-App Angular CI/CD

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: npm install


      - name: Build Angular production
        run: npm run build:prod


      - name: Rename index for GitHub Pages routing
        run: mv dist/my-app/browser/index.html dist/my-app/browser/404.html


      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/my-app/browser
          branch: gh-pages