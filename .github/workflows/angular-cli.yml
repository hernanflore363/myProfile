name: Angular CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    name: Build Angular Application

    runs-on: ubuntu-latest


    steps:

      # Descargar código
      - name: Checkout repository
        uses: actions/checkout@v4


      # Instalar Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # Instalar dependencias
      - name: Install dependencies
        run: npm ci


      # Ejecutar build Angular
      - name: Build Angular
        run: npm run build